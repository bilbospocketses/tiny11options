# CI: build + test on every push to main and every PR targeting main.
#
# This workflow enables the `required_status_checks` rule on the main branch
# ruleset (rule references the `build-and-test` job context). Without this
# workflow existing and running, the rule would block ALL pushes to main
# because the required check would never report.
#
# All actions are pinned to commit SHAs per the repo-level
# `sha_pinning_required` enforcement. Trailing `# vX.Y.Z` comments preserve
# human-readable version context. Dependabot (`.github/dependabot.yml`,
# `package-ecosystem: github-actions`) PRs SHA bumps as upstream actions tag
# new versions.
#
# Image: windows-2025-vs2026 matches release.yml so CI exercises the same
# .NET 10 SDK + Pester + WebView2 surface that ships.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The American-spelling gate below diffs from the merge-base with the
          # base branch and refuses a shallow clone.
          fetch-depth: 0

      # American spelling. The cross-repo gate from bilbospocketses/american-spelling
      # scans the lines this branch adds and its commit messages, and fails on a
      # British spelling. It runs first because it is the cheapest gate here.
      #
      # Steps inside build-and-test rather than a job of their own: main's ruleset
      # requires a check named exactly `build-and-test`, so a separate job would
      # not be required and could rot unnoticed.
      #
      # Exceptions are not kept in this repo. A verbatim quote takes the inline
      # `spelling: allow` marker; an identifier used on many lines goes in the
      # gate's central allow.txt, and reaches this repo when the pin is bumped.
      # On a push to main the base is main itself, so there is nothing to scan.
      #
      # These steps run in Git Bash (`shell: bash`) so `${BASE}` and `rm -rf`
      # work on this Windows image, and call `python` because `python3` is not
      # reliably on PATH on the Windows runners.
      - name: Fetch the base branch
        shell: bash
        run: git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
      - name: Check out the American-spelling gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bilbospocketses/american-spelling
          ref: 21ed7e5524c511d9ee584778d42b72e6ddaeba86 # v1.0.2
          path: .american-spelling
          persist-credentials: false
      - name: Check American spelling
        # The runner's own Python 3; the gate is stdlib-only.
        shell: bash
        run: >-
          python .american-spelling/check-american-spelling.py
          --repo .
          --base "origin/${BASE}"
          --repo-slug "${SLUG}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
          SLUG: ${{ github.repository }}
      - name: Remove the gate checkout
        # Keeps it out of the build, test and artifact steps further down.
        shell: bash
        run: rm -rf .american-spelling

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tiny11options.sln

      - name: Build
        run: dotnet build tiny11options.sln -c Release --no-restore

      - name: Test (xUnit)
        run: dotnet test launcher/Tests/tiny11options.Launcher.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Test (Pester)
        shell: pwsh
        # tests/Run-Tests.ps1 owns the Pester version (its PESTER_PIN line). Read it from
        # there and install exactly that version so the number lives in one place;
        # the runner then re-imports the pin itself and fails if anything else loaded.
        run: |
          $pin = (Select-String -Path tests/Run-Tests.ps1 -Pattern "= '([^']+)',\s+# PESTER_PIN").Matches[0].Groups[1].Value
          Write-Host "Pester pin from tests/Run-Tests.ps1: $pin"
          Install-Module Pester -RequiredVersion $pin -Force -SkipPublisherCheck -Scope CurrentUser -ErrorAction Stop
          pwsh -NoProfile -File tests/Run-Tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "tests/Run-Tests.ps1 exited $LASTEXITCODE" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/test-results.trx'
